openapi: 3.2.0
info:
    title: Session service
    description: HTTP service that showcase the use of HTTP cookies in Goa services.
    version: 0.0.1
servers:
    - url: http://localhost:80
      name: session
      description: Default server for session
paths:
    /:
        get:
            tags:
                - session
            summary: use_session session
            operationId: session#use_session
            parameters:
                - name: SID
                  in: cookie
                  description: Session ID
                  required: true
                  schema:
                    type: string
                    description: Session ID
                    example: Porro animi illum et corporis nobis.
                  example: Laborum nihil sint adipisci quia porro.
            responses:
                "200":
                    description: OK response.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CreateSessionResponseBody'
                            example:
                                message: Qui vitae in assumenda.
        post:
            tags:
                - session
            summary: create_session session
            operationId: session#create_session
            requestBody:
                description: Request body for create_session.
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateSessionRequestBody'
                        example:
                            name: Et distinctio eos dolores quibusdam adipisci.
            responses:
                "200":
                    description: OK response.
                    headers:
                        Set-Cookie:
                            description: Session ID
                            schema:
                                type: string
                                description: Session ID
                                example: Repellendus suscipit.
                            example: Voluptatem quia vel vel.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CreateSessionResponseBody'
                            example:
                                message: Voluptatem at id delectus magnam ut consequatur.
components:
    schemas:
        CreateSessionRequestBody:
            type: object
            properties:
                name:
                    type: string
                    description: Name of session
                    example: Et distinctio eos dolores quibusdam adipisci.
            description: Request body for create_session.
            example:
                name: Et distinctio eos dolores quibusdam adipisci.
            required:
                - name
        CreateSessionResponseBody:
            type: object
            properties:
                message:
                    type: string
                    description: User message
                    example: Voluptatem at id delectus magnam ut consequatur.
            example:
                message: Voluptatem at id delectus magnam ut consequatur.
            required:
                - message
tags:
    - name: session
      description: The session service illustrates managing user sessions with cookies.
