openapi: 3.2.0
info:
    title: Goa API
    version: 0.0.1
servers:
    - url: http://localhost:80
      name: calc
      description: Default server for calc
paths:
    /:
        post:
            tags:
                - calc
            summary: divide calc
            operationId: calc#divide
            requestBody:
                description: Request body for divide.
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/DivideRequestBody'
                        example:
                            dividend: 1196350668178300830
                            divisor: 5941732484439269441
            responses:
                "200":
                    description: OK response.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/DivideResponseBody'
                            example:
                                quotient: 3989696267411135677
                                reminder: 6133210891814429636
                "400":
                    description: 'div_by_zero: Response used for division by zero errors'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/DivByZero'
                            example:
                                message: Eius exercitationem nemo ipsa eveniet est.
                "504":
                    description: 'timeout: Operation timed out'
                    content:
                        application/vnd.goa.error:
                            schema:
                                $ref: '#/components/schemas/Error'
components:
    schemas:
        DivByZero:
            type: object
            properties:
                message:
                    type: string
                    description: division by zero leads to infinity.
                    example: Eius exercitationem nemo ipsa eveniet est.
            description: division by 0
            example:
                message: Eius exercitationem nemo ipsa eveniet est.
            required:
                - message
        DivideRequestBody:
            type: object
            properties:
                dividend:
                    type: integer
                    example: 1196350668178300830
                    format: int64
                divisor:
                    type: integer
                    example: 5941732484439269441
                    format: int64
            description: Request body for divide.
            example:
                dividend: 1196350668178300830
                divisor: 5941732484439269441
            required:
                - dividend
                - divisor
        DivideResponseBody:
            type: object
            properties:
                quotient:
                    type: integer
                    example: 3989696267411135677
                    format: int64
                reminder:
                    type: integer
                    example: 6133210891814429636
                    format: int64
            example:
                quotient: 3989696267411135677
                reminder: 6133210891814429636
            required:
                - quotient
                - reminder
        Error:
            type: object
            properties:
                fault:
                    type: boolean
                    description: Is the error a server-side fault?
                    example: true
                id:
                    type: string
                    description: ID is a unique identifier for this particular occurrence of the problem.
                    example: 123abc
                message:
                    type: string
                    description: Message is a human-readable explanation specific to this occurrence of the problem.
                    example: parameter 'p' must be an integer
                name:
                    type: string
                    description: Name is the name of this class of errors.
                    example: bad_request
                temporary:
                    type: boolean
                    description: Is the error temporary?
                    example: true
                timeout:
                    type: boolean
                    description: Is the error a timeout?
                    example: true
            description: Error response result type
            example:
                fault: true
                id: 123abc
                message: parameter 'p' must be an integer
                name: bad_request
                temporary: true
                timeout: true
            required:
                - name
                - id
                - message
                - temporary
                - timeout
                - fault
tags:
    - name: calc
