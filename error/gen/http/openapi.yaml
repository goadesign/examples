swagger: "2.0"
info:
    title: ""
    version: 0.0.1
host: localhost:80
consumes:
    - application/json
    - application/xml
    - application/gob
produces:
    - application/json
    - application/xml
    - application/gob
paths:
    /:
        post:
            tags:
                - calc
            summary: divide calc
            operationId: calc#divide
            parameters:
                - name: DivideRequestBody
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/CalcDivideRequestBody'
                    required:
                        - dividend
                        - divisor
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/CalcDivideResponseBody'
                        required:
                            - quotient
                            - reminder
                "400":
                    description: Response used for division by zero errors
                    schema:
                        $ref: '#/definitions/DivByZero'
                        required:
                            - message
                "504":
                    description: Operation timed out
                    schema:
                        $ref: '#/definitions/CalcDivideTimeoutResponseBody'
            schemes:
                - http
definitions:
    CalcDivideRequestBody:
        title: CalcDivideRequestBody
        type: object
        properties:
            dividend:
                type: integer
                example: 1196350668178300830
                format: int64
            divisor:
                type: integer
                example: 5941732484439269441
                format: int64
        example:
            dividend: 1196350668178300830
            divisor: 5941732484439269441
        required:
            - dividend
            - divisor
    CalcDivideResponseBody:
        title: CalcDivideResponseBody
        type: object
        properties:
            quotient:
                type: integer
                example: 3989696267411135677
                format: int64
            reminder:
                type: integer
                example: 6133210891814429636
                format: int64
        example:
            quotient: 3989696267411135677
            reminder: 6133210891814429636
        required:
            - quotient
            - reminder
    CalcDivideTimeoutResponseBody:
        title: 'Mediatype identifier: application/vnd.goa.error; view=default'
        type: object
        properties:
            fault:
                type: boolean
                description: Is the error a server-side fault?
                example: true
            id:
                type: string
                description: ID is a unique identifier for this particular occurrence of the problem.
                example: 123abc
            message:
                type: string
                description: Message is a human-readable explanation specific to this occurrence of the problem.
                example: parameter 'p' must be an integer
            name:
                type: string
                description: Name is the name of this class of errors.
                example: bad_request
            temporary:
                type: boolean
                description: Is the error temporary?
                example: false
            timeout:
                type: boolean
                description: Is the error a timeout?
                example: true
        description: Error response result type (default view)
        example:
            fault: true
            id: 123abc
            message: parameter 'p' must be an integer
            name: bad_request
            temporary: false
            timeout: true
        required:
            - name
            - id
            - message
            - temporary
            - timeout
            - fault
    DivByZero:
        title: DivByZero
        type: object
        properties:
            message:
                type: string
                description: division by zero leads to infinity.
                example: Eius exercitationem nemo ipsa eveniet est.
        description: division by 0
        example:
            message: Eius exercitationem nemo ipsa eveniet est.
        required:
            - message
