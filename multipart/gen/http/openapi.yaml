                description: Experience section in the resume
                example:
                    - company: Saepe enim.
                      duration: 4129157726558553807
                      role: Aut sit aut dolores sed ut ut.
                    - company: Saepe enim.
                      duration: 4129157726558553807
                      role: Aut sit aut dolores sed ut ut.
            name:
                type: string
                description: Name in the resume
                example: Explicabo et eligendi expedita necessitatibus eius qui.
        example:
            education:
                - institution: Ipsum saepe quia est.
                  major: Fuga placeat est voluptatem sed.
                - institution: Ipsum saepe quia est.
