swagger: "2.0"
info:
    title: ""
    version: 0.0.1
host: localhost:80
consumes:
    - application/json
    - application/xml
    - application/gob
produces:
    - application/json
    - application/xml
    - application/gob
paths:
    /resumes:
        get:
            tags:
                - resume
            summary: list resume
            description: List all stored resumes
            operationId: resume#list
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/ResumeStoredResumeResponseCollection'
            schemes:
                - http
        post:
            tags:
                - resume
            summary: add resume
            description: Add n number of resumes and return their IDs. This is a multipart request and each part has field name 'resume' and contains the encoded resume to be added.
            operationId: resume#add
            consumes:
                - multipart/form-data
            parameters:
                - name: array
                  in: formData
                  required: true
                  schema:
                    type: array
                    items:
                        $ref: '#/definitions/Resume'
            responses:
                "200":
                    description: OK response.
                    schema:
                        type: array
                        items:
                            type: integer
                            example: 5765309117005200142
                            format: int64
            schemes:
                - http
definitions:
    Education:
        title: Education
        type: object
        properties:
            institution:
                type: string
                description: Name of the institution
                example: Est enim ut odio rerum.
            major:
                type: string
                description: Major name
                example: Explicabo sapiente est praesentium sunt et.
        example:
            institution: Est enim ut odio rerum.
            major: Explicabo sapiente est praesentium sunt et.
        required:
            - institution
            - major
    Experience:
        title: Experience
        type: object
        properties:
            company:
                type: string
                description: Name of the company
                example: Eum ut.
            duration:
                type: integer
                description: Duration (in years) in the company
                example: 7855387208056668376
                format: int64
            role:
                type: string
                description: Name of the role in the company
                example: Quam minima dolorum et voluptatem velit.
        example:
            company: Eum ut.
            duration: 7855387208056668376
            role: Quam minima dolorum et voluptatem velit.
        required:
            - company
            - role
            - duration
    Resume:
        title: Resume
        type: object
        properties:
            education:
