openapi: 3.0.3
info:
    title: Goa API
    version: 0.0.1
servers:
    - url: http://localhost:80
      description: Default server for monitor
paths:
    /{filepath}:
        get:
            tags:
                - monitor
            summary: Download public
            operationId: monitor#/{filepath}
            parameters:
                - name: filepath
                  in: path
                  description: Relative file path
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: File downloaded
                "404":
                    description: File not found
    /monitor:
        get:
            tags:
                - monitor
            summary: monitor monitor
            description: Monitor CPU and memory usage via Server-Sent Events
            operationId: monitor#monitor
            responses:
                "200":
                    description: OK response.
                    content:
                        text/event-stream:
                            schema:
                                $ref: '#/components/schemas/Usage'
                            example:
                                cpu: 50
                                memory: 30
                                timestamp: "1987-11-07T01:47:47Z"
components:
    schemas:
        Usage:
            type: object
            properties:
                cpu:
                    type: integer
                    description: CPU usage percentage
                    example: 50
                    format: int64
                memory:
                    type: integer
                    description: Memory usage percentage
                    example: 30
                    format: int64
                timestamp:
                    type: string
                    description: Timestamp of the usage report
                    example: "1987-11-07T01:47:47Z"
                    format: date-time
            example:
                cpu: 50
                memory: 30
                timestamp: "1987-11-07T01:47:47Z"
            required:
                - timestamp
                - cpu
                - memory
tags:
    - name: monitor
      description: The monitor service provides real-time system monitoring via SSE
