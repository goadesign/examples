openapi: 3.2.0
info:
    title: File Upload Service
    description: HTTP service for uploading files using the tus protocol (https://tus.io)
    version: 0.0.1
servers:
    - url: http://localhost:8000/upload
      name: Upload
      description: Upload hosts the upload service.
