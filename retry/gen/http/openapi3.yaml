openapi: 3.0.3
info:
    title: Retry Service
    description: Demonstrates transport-independent retries for an idempotent method.
    version: 0.0.1
servers:
    - url: http://localhost:18080
      description: retry hosts the retry example service.
paths:
    /messages/{id}:
        get:
            description: Returns a stable message after a temporary first-attempt failure.
            operationId: retry#get_message
            parameters:
                - description: Identifies one demonstration request.
                  example: Nemo qui atque iure.
                  in: path
                  name: id
                  required: true
                  schema:
                    description: Identifies one demonstration request.
                    example: Omnis eius maiores aut et rerum veritatis.
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            example:
                                message: Quaerat cum fugiat fugiat aut quia qui.
                            schema:
                                $ref: '#/components/schemas/GetMessageResponseBody'
                    description: OK response.
                "503":
                    content:
                        application/vnd.goa.error:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: 'unavailable: The message is temporarily unavailable.'
            summary: get_message retry
            tags:
                - retry
            x-goa-idempotent: true
components:
    schemas:
        Error:
            type: object
            properties:
                fault:
                    type: boolean
                    description: Is the error a server-side fault?
                    example: true
                id:
                    type: string
                    description: ID is a unique identifier for this particular occurrence of the problem.
                    example: 123abc
                message:
                    type: string
                    description: Message is a human-readable explanation specific to this occurrence of the problem.
                    example: parameter 'p' must be an integer
                name:
                    type: string
                    description: Name is the name of this class of errors.
                    example: bad_request
                temporary:
                    type: boolean
                    description: Is the error temporary?
                    example: false
                timeout:
                    type: boolean
                    description: Is the error a timeout?
                    example: false
            description: The message is temporarily unavailable.
            example:
                fault: true
                id: 123abc
                message: parameter 'p' must be an integer
                name: bad_request
                temporary: false
                timeout: false
            required:
                - name
                - id
                - message
                - temporary
                - timeout
                - fault
        GetMessageResponseBody:
            type: object
            properties:
                message:
                    type: string
                    description: Message returned after the retry succeeds.
                    example: Quaerat cum fugiat fugiat aut quia qui.
            example:
                message: Quaerat cum fugiat fugiat aut quia qui.
            required:
                - message
tags:
    - name: retry
      description: Returns a message after demonstrating one safe retry.
