openapi: 3.2.0
info:
    title: Calculator Service
    description: HTTP service for multiplying numbers, a goa teaser
    version: 0.0.1
servers:
    - url: http://localhost:8000/calc
      name: calc-development
      description: calc hosts the Calculator Service.
    - url: https://{version}.goa.design/calc
      name: calc-production
      description: calc hosts the Calculator Service.
      variables:
        version:
            default: v1
            description: API version
paths:
    /multiply/{a}/{b}:
        get:
            tags:
                - calc
            summary: multiply calc
            operationId: calc#multiply
            parameters:
                - name: a
                  in: path
                  description: Left operand
                  required: true
                  schema:
                    type: integer
                    description: Left operand
                    example: 8789074496583346340
                    format: int64
                  example: 8789074496583346340
                - name: b
                  in: path
                  description: Right operand
                  required: true
                  schema:
                    type: integer
                    description: Right operand
                    example: 7413121258658775183
                    format: int64
                  example: 7413121258658775183
            responses:
                "200":
                    description: OK response.
                    content:
                        application/json:
                            schema:
                                type: integer
                                example: 9089701625346839968
                                format: int64
                            example: 9089701625346839968
    /openapi.json:
        get:
            tags:
                - calc
            summary: Download gen/http/openapi3.json
            operationId: calc#/openapi.json
            responses:
                "200":
                    description: File downloaded
components: {}
tags:
    - name: calc
      description: The calc service performs operations on numbers
