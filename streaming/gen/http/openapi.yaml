swagger: "2.0"
info:
    title: Chatter service describing the streaming features of goa v2.
    version: 0.0.1
host: localhost:80
consumes:
    - application/json
    - application/xml
    - application/gob
produces:
    - application/json
    - application/xml
    - application/gob
paths:
    /echoer:
        get:
            tags:
                - chatter
            summary: echoer chatter
            description: |-
                Echoes the message sent by the client.

                **Required security scopes for jwt**:
                  * `stream:write`
            operationId: chatter#echoer
            responses:
                "101":
                    description: Switching Protocols response.
                    schema:
                        type: string
                "401":
                    description: Unauthorized response.
                    schema:
                        type: string
                "403":
                    description: Forbidden response.
                    schema:
                        type: string
            schemes:
                - ws
            security:
                - jwt_header_Authorization: []
    /history:
        get:
            tags:
                - chatter
            summary: history chatter
            description: |-
                Returns the chat messages sent to the server.

                **Required security scopes for jwt**:
                  * `stream:read`
            operationId: chatter#history
            parameters:
                - name: view
                  in: query
                  description: View to use to render the result
                  required: false
                  type: string
            responses:
                "101":
                    description: Switching Protocols response.
                    schema:
                        $ref: '#/definitions/GoaSummary'
                "401":
                    description: Unauthorized response.
                    schema:
                        type: string
                "403":
                    description: Forbidden response.
                    schema:
                        type: string
            schemes:
                - ws
            security:
                - jwt_header_Authorization: []
    /listener:
        get:
            tags:
                - chatter
            summary: listener chatter
            description: |-
                Listens to the messages sent by the client.

                **Required security scopes for jwt**:
                  * `stream:write`
            operationId: chatter#listener
            responses:
                "101":
                    description: Switching Protocols response.
                "401":
                    description: Unauthorized response.
                    schema:
                        type: string
                "403":
                    description: Forbidden response.
                    schema:
                        type: string
            schemes:
                - ws
            security:
                - jwt_header_Authorization: []
    /login:
        post:
            tags:
                - chatter
            summary: login chatter
            description: Creates a valid JWT token for auth to chat.
            operationId: chatter#login
            responses:
                "200":
                    description: OK response.
                    schema:
                        type: string
                "401":
                    description: Unauthorized response.
                    schema:
                        type: string
            schemes:
                - http
            security:
                - basic_header_Authorization: []
    /subscribe:
        get:
            tags:
                - chatter
            summary: subscribe chatter
            description: |-
                Subscribe to events sent when new chat messages are added.

                **Required security scopes for jwt**:
                  * `stream:write`
            operationId: chatter#subscribe
            responses:
                "101":
                    description: Switching Protocols response.
                    schema:
                        $ref: '#/definitions/Event'
                        required:
                            - message
                            - action
                            - added_at
                "401":
                    description: Unauthorized response.
                    schema:
                        type: string
                "403":
                    description: Forbidden response.
                    schema:
                        type: string
            schemes:
                - ws
            security:
                - jwt_header_Authorization: []
    /summary:
        get:
            tags:
                - chatter
            summary: summary chatter
            description: |-
                Summarizes the chat messages sent by the client.

                **Required security scopes for jwt**:
                  * `stream:write`
            operationId: chatter#summary
            responses:
                "101":
                    description: Switching Protocols response.
                    schema:
                        $ref: '#/definitions/ChatterChatSummaryResponseCollection'
                "401":
                    description: Unauthorized response.
                    schema:
                        type: string
                "403":
                    description: Forbidden response.
                    schema:
                        type: string
            schemes:
                - ws
            security:
                - jwt_header_Authorization: []
definitions:
    ChatSummaryResponse:
        title: 'Mediatype identifier: application/vnd.goa.summary; view=default'
        type: object
        properties:
            length:
                type: integer
                description: Length of the message sent
                example: 6974027342252250665
                format: int64
            message:
                type: string
                description: Message sent to the server
                example: Porro velit.
            sent_at:
                type: string
                description: Time at which the message was sent
                example: "1997-08-20T21:13:26Z"
                format: date-time
        description: ChatSummaryResponse result type (default view)
        example:
            length: 6974027342252250665
            message: Porro velit.
            sent_at: "1997-08-20T21:13:26Z"
        required:
            - message
            - sent_at
    ChatterChatSummaryResponseCollection:
        title: 'Mediatype identifier: application/vnd.goa.summary; type=collection; view=default'
        type: array
        items:
            $ref: '#/definitions/ChatSummaryResponse'
        description: SummaryResponseBody is the result type for an array of ChatSummaryResponse (default view)
        example:
            - length: 6974027342252250665
              message: Porro velit.
              sent_at: "1997-08-20T21:13:26Z"
            - length: 6974027342252250665
              message: Porro velit.
              sent_at: "1997-08-20T21:13:26Z"
            - length: 6974027342252250665
              message: Porro velit.
              sent_at: "1997-08-20T21:13:26Z"
    Event:
        title: Event
        type: object
        properties:
            action:
                type: string
                example: added
                enum:
                    - added
            added_at:
                type: string
                description: Time at which the message was added
                example: "2012-03-23T20:03:18Z"
                format: date-time
            message:
                type: string
                description: Message sent to the server
                example: Nostrum quia asperiores et sint deleniti cumque.
        example:
            action: added
            added_at: "2012-03-23T20:03:18Z"
            message: Nostrum quia asperiores et sint deleniti cumque.
        required:
            - message
            - action
            - added_at
    GoaSummary:
        title: 'Mediatype identifier: application/vnd.goa.summary; view=default'
        type: object
        properties:
            length:
                type: integer
                description: Length of the message sent
                example: 6974027342252250665
                format: int64
            message:
                type: string
                description: Message sent to the server
                example: Porro velit.
            sent_at:
                type: string
                description: Time at which the message was sent
                example: "1997-08-20T21:13:26Z"
                format: date-time
        description: HistoryResponseBody result type (default view)
        example:
            length: 6974027342252250665
            message: Porro velit.
            sent_at: "1997-08-20T21:13:26Z"
        required:
            - message
            - sent_at
securityDefinitions:
    basic_header_Authorization:
        type: basic
        description: Secures the login endpoint.
    jwt_header_Authorization:
        type: apiKey
        description: |-
            Secures endpoint by requiring a valid JWT token. Supports scopes "stream:read" and "stream:write".

            **Security Scopes**:
              * `stream:read`: Read-only access
              * `stream:write`: Read and write access
        name: Authorization
        in: header
